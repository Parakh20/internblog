services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: internblog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: internblog
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internblog"]
      interval: 10s
      timeout: 5s
      retries: 5

  monitor:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://internblog:${POSTGRES_PASSWORD}@db:5432/internblog
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage_state.json:/app/storage_state.json
      - ./browser_profile:/app/browser_profile
      - ./data:/app/data
      - ./logs:/app/logs

  # Reverse proxy with automatic HTTPS, so the /calendar/{token}.ics feed is
  # reachable by Google's own servers (a plain localhost port is not enough
  # for Google Calendar's URL subscription to poll). Only enabled once
  # CADDY_DOMAIN is set in .env; see docs/deployment.md.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - monitor
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
