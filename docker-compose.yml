services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: internblog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: internblog
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internblog"]
      interval: 10s
      timeout: 5s
      retries: 5

  monitor:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://internblog:${POSTGRES_PASSWORD}@db:5432/internblog
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage_state.json:/app/storage_state.json
      - ./browser_profile:/app/browser_profile
      - ./data:/app/data
      - ./logs:/app/logs

volumes:
  pgdata:
